services:
  - type: web
    name: wedding-rsvp-headcount
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-mysql-db
          property: connectionString

databases:
  - name: wedding-mysql-db
    plan: free
    databaseName: wedding_rsvp
    user: wedding_user
